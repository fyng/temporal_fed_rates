[project]
name = "fedrates"
version = "0.1.0"
description = "Analysis and visualisation of US Federal Reserve rate decisions over the last 30 years, using FRED data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "plotly>=5.24",
    "kaleido",
    "matplotlib",
    "seaborn",
    "fredapi",
    "python-dotenv",
    "requests",
    "statsmodels",
    "scikit-learn",
    "scipy",
    "openpyxl",
    "beautifulsoup4",
    "lxml",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "jupyterlab",
    "ipykernel",
    "nbformat",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fedrates"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet", "slow: minutes-long real-record runs"]
addopts = "-m 'not network and not slow'"
